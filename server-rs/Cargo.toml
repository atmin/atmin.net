[package]
name = "atmin-server"
version = "0.1.0"
edition = "2021"
description = "Rust port experiment of the atmin backend (ADR-0018, phase 1 interop spike)."

[dependencies]
rocket = { version = "0.5", features = ["json"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "0.1"
ciborium = "0.2"
ulid = "1"

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }

[package]
name = "atmin-server"
version = "0.1.0"
edition = "2021"
description = "atmin.net backend — a stateless, end-to-end-encrypted S3 proxy and SSE hub (Rocket)."

[dependencies]
rocket = { version = "0.5", features = ["json"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "0.1"
ciborium = "0.2"
ulid = "1"
log = "0.4"
aws-sdk-s3 = "1"
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[features]
# Embed the built web SPA (../web/dist) into the binary and serve it (production
# parity with Go's //go:embed). Off by default so the fmt/lint/test gates and a
# standalone `cargo test` never depend on a web build; production, e2e, and the
# dev SPA-smoke build with `--features embed-spa`.
embed-spa = ["dep:rust-embed"]

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }

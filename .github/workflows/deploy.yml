name: CI/CD

on:
  push:
    branches: [master]
    tags: [v*]

env:
  REGISTRY: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
  IMAGE_NAME: atmindotnet

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE_NAME }}:ci
          outputs: type=docker,dest=/tmp/app-image.tar
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app-image.tar
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo installs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ hashFiles('web/crypto/Cargo.lock') }}

      - name: Install wasm-pack
        run: which wasm-pack || curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Cache WASM build
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            web/crypto/pkg
            web/crypto/pkg-node
          key: wasm-${{ hashFiles('web/crypto/Cargo.lock', 'web/crypto/src/**') }}

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cd web && npm run build:wasm

      - name: Build web
        run: cd web && npm run build

      - name: Copy web assets for server
        run: cp -r web/dist server/dist

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo installs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ hashFiles('web/crypto/Cargo.lock') }}

      - name: Install wasm-pack
        run: which wasm-pack || curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Cache WASM build
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            web/crypto/pkg
            web/crypto/pkg-node
          key: wasm-${{ hashFiles('web/crypto/Cargo.lock', 'web/crypto/src/**') }}

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cd web && npm run build:wasm

      - name: Build web
        run: cd web && npm run build

      - name: Copy web assets for server
        run: cp -r web/dist server/dist

      - name: Unit tests
        run: make test

  e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Download app image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load app image
        run: docker load -i /tmp/app-image.tar

      - name: Run app container
        env:
          E2E_BUCKET: atmin-e2e-${{ github.run_id }}
        run: |
          docker run -d --name app --network host \
            -e LISTEN_ADDR=:8080 \
            -e SERVER_SECRET=e2e-test-secret \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_PUBLIC_ENDPOINT=http://localhost:9000 \
            -e S3_BUCKET=$E2E_BUCKET \
            -e S3_REGION=us-east-1 \
            -e S3_ACCESS_KEY=minioadmin \
            -e S3_SECRET_KEY=minioadmin \
            ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd web && npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd web && npx playwright install-deps chromium

      - name: Run e2e tests
        env:
          E2E_BUCKET: atmin-e2e-${{ github.run_id }}
        run: cd web && npx playwright test

      - name: App container logs
        if: always()
        run: docker logs app || true

  deploy-staging:
    if: github.ref == 'refs/heads/master'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Download app image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load app image
        run: docker load -i /tmp/app-image.tar

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master

      - name: Install Scaleway CLI
        run: |
          SCW_URL=$(curl -s https://api.github.com/repos/scaleway/scaleway-cli/releases/latest | grep -o '"browser_download_url": *"[^"]*linux_amd64"' | cut -d'"' -f4)
          curl -fsSL "$SCW_URL" -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw

      - name: Deploy to staging
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: scw container container deploy ${{ secrets.SCW_STAGING_CONTAINER_ID }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Download app image
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load app image
        run: docker load -i /tmp/app-image.tar

      - name: Tag and push
        run: |
          docker tag ${{ env.IMAGE_NAME }}:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker tag ${{ env.IMAGE_NAME }}:ci ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Install Scaleway CLI
        run: |
          SCW_URL=$(curl -s https://api.github.com/repos/scaleway/scaleway-cli/releases/latest | grep -o '"browser_download_url": *"[^"]*linux_amd64"' | cut -d'"' -f4)
          curl -fsSL "$SCW_URL" -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw

      - name: Deploy to Scaleway Serverless Container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: scw container container deploy ${{ secrets.SCW_CONTAINER_ID }}

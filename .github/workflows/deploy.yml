name: CI/CD

on:
  push:
    branches: [master]
    tags: [v*]

env:
  REGISTRY: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
  IMAGE_NAME: atmindotnet

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: make web-build

      - name: Copy web assets for server
        run: cp -r web/dist server/dist

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: make web-build

      - name: Copy web assets for server
        run: cp -r web/dist server/dist

      - name: Unit tests
        run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: make web-build

      - name: Copy web assets for server
        run: cp -r web/dist server/dist

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: cd web && npx playwright test

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Scaleway Serverless Container
        uses: scaleway/serverless-container-deploy-action@v1
        with:
          container_id: ${{ secrets.SCW_CONTAINER_ID }}
          registry_image_url: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          secret_key: ${{ secrets.SCW_SECRET_KEY }}

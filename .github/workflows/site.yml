name: Site

# Marketing site at the apex atmin.net (ADR-0025), on GitHub Pages. Deliberately
# separate from deploy.yml: path-filtered to site/** so brochure edits never
# rebuild or redeploy the messenger, and vice versa. Master push publishes — a
# static brochure has no e2e gate to clear, so no tag ceremony.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN needs write to push the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: cd site && pnpm install --frozen-lockfile

      - name: Build (astro check + build)
        run: cd site && pnpm build

      # Publish dist/ to this repo's gh-pages branch; GitHub Pages serves it at
      # the apex atmin.net with auto-provisioned TLS (see docs/ops.md "Marketing
      # site" for the Pages + DNS setup). Mirrors the deploy-storybook job in
      # deploy.yml — but same-repo, so the default GITHUB_TOKEN suffices (no PAT,
      # unlike Storybook's external-repo publish). peaceiris writes a .nojekyll
      # by default, so Astro's _astro/ asset dir is served (Jekyll would strip
      # leading-underscore paths); `cname` re-asserts the CNAME file each publish
      # so the custom domain sticks.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: gh-pages
          cname: atmin.net
